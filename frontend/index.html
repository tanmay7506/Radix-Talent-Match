<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alohomora — Talent Intelligence Platform</title>
    
    <!-- Google Fonts: Clean Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind Play CDN for Exact Token Compatibility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "bg-base": "#0B0B0B",
              "surface-main": "#141414",
              "surface-secondary": "#1C1C1C",
              "text-primary": "#F5F5F5",
              "text-secondary": "#A0A0A0",
              "border-main": "#303030",
              "brand-red": "#E50914",
              "brand-red-dark": "#B20710"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.375rem",
              xl: "0.5rem"
            },
            fontFamily: {
              sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
              mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"]
            }
          }
        }
      };
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0B0B0B;
        color: #F5F5F5;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0B0B;
      }
      ::-webkit-scrollbar-thumb {
        background: #303030;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #404040;
      }
    </style>
  </head>
  <body class="bg-[#0B0B0B] text-[#F5F5F5] antialiased selection:bg-[#E50914] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
