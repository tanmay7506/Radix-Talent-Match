<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alohomora — Autonomous Talent Intelligence</title>
    
    <!-- Google Fonts: Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind Play CDN for Exact Stitch Token Compatibility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-base": "#0A0A0A",
              "surface": "#131313",
              "surface-card": "#141414",
              "surface-raised": "#1A1A1A",
              "surface-container": "#201f1f",
              "surface-container-high": "#2a2a2a",
              "surface-container-highest": "#353534",
              "surface-bright": "#3a3939",
              "border-subtle": "#262626",
              "primary-container": "#e50914",
              "secondary-container": "#a00216",
              "text-primary": "#FFFFFF",
              "text-secondary": "#A3A3A3",
              "text-tertiary": "#737373",
              "primary": "#ffb4aa",
              "secondary": "#ffb3ad",
              "primary-fixed-dim": "#ffb4aa",
              "on-primary-container": "#fff7f6",
              "on-primary": "#690003",
              "surface-dim": "#131313"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.375rem",
              xl: "0.5rem",
              full: "9999px"
            },
            spacing: {
              "space-xs": "0.25rem",
              "space-sm": "0.5rem",
              "space-md": "1rem",
              "space-lg": "1.5rem",
              "space-xl": "2.5rem",
              gutter: "1.5rem",
              margin: "3rem"
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"]
            }
          }
        }
      };
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0A0A0A;
        color: #FFFFFF;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Custom subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0A0A;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #353534;
      }
    </style>
  </head>
  <body class="bg-surface-base text-text-primary antialiased selection:bg-primary-container selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
