[project]
name = "radix-talent-check"
version = "1.0.0"
description = "RADIX Talent Check API - Evaluates candidate readiness against company skill requirements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "groq>=0.9.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "test_schemas.py"]
